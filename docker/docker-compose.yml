# Project name is pinned so the stack keeps one identity no matter which
# directory compose is invoked from. Override with `-p` when running several
# environments side by side (see docs/deployment.md).
name: ksef-integration-api

services:
  ksef-encryptor:
    build:
      # Build context is the repository root; paths inside the Dockerfile are
      # relative to it. Compose resolves this against THIS file's directory.
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      PORT: "5000"
      WORKERS: "3"
      THREADS: "2"
      KSEF_NODE_BIN: "node"
      KSEF_PDF_BRIDGE_PATH: "./pdf_generator_bridge.mjs"
      KSEF_PDF_MODULE_PATH: "./pdf-generator/dist/ksef-fe-invoice-converter.js"
      KSEF_PDF_TIMEOUT_SECONDS: "60"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
